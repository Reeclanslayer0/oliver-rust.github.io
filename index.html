<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eclipse Rust</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    font-family:Arial, sans-serif;
    background:#05070a;
    color:white;
    overflow-x:hidden;
}

/* CEON BLUE BACKGROUND GLOW */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at 20% 30%, rgba(0,200,255,.10), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(0,200,255,.08), transparent 45%),
    linear-gradient(180deg,#05070a,#070c12);
    z-index:-1;
}

/* SCROLLBAR */
::-webkit-scrollbar{
    width:8px;
}
::-webkit-scrollbar-thumb{
    background:#00c8ff;
    border-radius:10px;
}

/* TOP NAV (closer buttons) */
nav{
    position:fixed;
    top:0;
    width:100%;
    z-index:999;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(10px);
    padding:8px 0;
    border-bottom:1px solid rgba(0,200,255,.15);
}

nav ul{
    display:flex;
    justify-content:center;
    gap:18px; /* closer buttons */
    list-style:none;
}

nav a{
    color:#aaa;
    text-decoration:none;
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    transition:.2s;
}

nav a:hover{
    color:#00c8ff;
}

/* MAIN MENU */
.hero{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

/* LEFT PANEL */
.leftPanel{
    position:absolute;
    left:8%;
    top:50%;
    transform:translateY(-50%);
}

.title{
    font-size:74px;
    color:#00c8ff;
    letter-spacing:6px;
    text-shadow:0 0 25px rgba(0,200,255,.6);
}

.subtitle{
    color:#aaa;
    margin-top:8px;
    letter-spacing:2px;
    font-size:13px;
}

/* MENU */
.menu{
    margin-top:25px;
    display:flex;
    flex-direction:column;
    gap:10px;
    width:210px;
}

.menu a{
    padding:11px;
    background:rgba(10,15,20,.75);
    border:1px solid rgba(0,200,255,.15);
    color:#ddd;
    text-decoration:none;
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:12px;
    transition:.2s;
    cursor:pointer;
}

.menu a:hover{
    background:#00c8ff;
    color:black;
    transform:translateX(5px);
}

/* RIGHT PANEL */
.serverPanel{
    position:absolute;
    right:8%;
    top:50%;
    transform:translateY(-50%);
    width:260px;
    background:rgba(10,15,20,.75);
    border:1px solid rgba(0,200,255,.15);
    padding:18px;
}

.serverPanel h3{
    color:#00c8ff;
    margin-bottom:10px;
    letter-spacing:2px;
}

.serverPanel p{
    font-size:13px;
    color:#aaa;
    line-height:1.5;
}

.status{
    margin-top:12px;
    padding:7px;
    background:rgba(0,0,0,.4);
    border-left:3px solid #00c8ff;
    font-size:12px;
}

/* BUTTON */
.btn{
    display:inline-block;
    margin-top:12px;
    padding:10px 18px;
    background:#00c8ff;
    color:black;
    text-decoration:none;
    font-weight:bold;
    font-size:12px;
    transition:.2s;
    cursor:pointer;
}

.btn:hover{
    transform:scale(1.05);
    background:#35d4ff;
}

/* FOOTER */
footer{
    text-align:center;
    padding:25px;
    background:black;
    color:#666;
    font-size:12px;
}

/* POPUP */
#popup{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    background:#00c8ff;
    color:black;
    padding:10px 18px;
    font-weight:bold;
    display:none;
    border-radius:6px;
}
</style>
</head>

<body>

<nav>
<ul>
<li><a href="#about">About</a></li>
<li><a href="#weapons">Weapons</a></li>
<li><a href="#join">Join</a></li>
</ul>
</nav>

<div class="hero">

<div class="leftPanel">
<div class="title">ECLIPSE</div>
<div class="subtitle">RUST MAIN MENU</div>

<div class="menu">
<a onclick="clickSound();">ABOUT</a>
<a onclick="clickSound();">WEAPONS</a>
<a href="https://discord.gg/DP5CgTvq" target="_blank" onclick="clickSound()">DISCORD</a>
<a onclick="connectServer()">CONNECT</a>
</div>
</div>

<div class="serverPanel">
<h3>SERVER INFO</h3>
<p>High action PvP survival server inspired by Rust.</p>

<div class="status">STATUS: Offline</div>
<div class="status">WIPE: 26.05.00</div>
<div class="status">PLAYERS: 0/100</div>
</div>

</div>

<div id="popup">SERVER LINK COPIED</div>

<audio id="clickSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a1d2a1.mp3?filename=click-124467.mp3"></audio>

<script>
function clickSound(){
    document.getElementById("clickSound").currentTime = 0;
    document.getElementById("clickSound").play();
}

function connectServer(){
    clickSound();

    navigator.clipboard.writeText("test");

    const popup = document.getElementById("popup");
    popup.style.display = "block";

    setTimeout(()=>{
        popup.style.display = "none";
    },2000);
}
</script>

</body>
</html>
